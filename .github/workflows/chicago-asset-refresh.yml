name: Chicago Asset Refresh

on:
  push:
    branches:
      - feat/chicago-rhythm-world-image

permissions:
  contents: write

concurrency:
  group: chicago-asset-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chicago-rhythm-world-image
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh visual asset registry
        run: |
          python3 tools/collect_visual_assets.py
          python3 tools/render_visual_asset_review.py
      - name: Verify navigation
        run: python3 tools/navigation_audit.py --strict
      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/media-assets.json .github/visual-asset-review.md
          git commit -m "chore: refresh Chicago visual asset registry"
          git push origin HEAD:feat/chicago-rhythm-world-image
