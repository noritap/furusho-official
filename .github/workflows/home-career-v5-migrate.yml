name: HOME Career v5 Migration

on:
  push:
    branches:
      - feat/home-career-v5-3vc

permissions:
  contents: write

concurrency:
  group: home-career-v5-migrate
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-career-v5-3vc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply HOME career v5 migration
        run: python3 tools/home_career_v5_migrate.py
      - name: Verify navigation
        run: python3 tools/navigation_audit.py --strict
      - name: Refresh visual asset registry
        run: |
          python3 tools/collect_visual_assets.py
          python3 tools/render_visual_asset_review.py
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/data/media-assets.json .github/visual-asset-review.md
          git commit -m "feat: unify HOME selected career visual cards"
          git push origin HEAD:feat/home-career-v5-3vc
