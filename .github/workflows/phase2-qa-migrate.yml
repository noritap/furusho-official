name: Phase2 QA Migration

on:
  push:
    branches:
      - feat/phase2-qa-3vc

permissions:
  contents: write

concurrency:
  group: phase2-qa-migrate
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-qa-3vc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply accessibility and SEO migration
        run: python3 tools/phase2_qa_migrate.py
      - name: Verify navigation
        run: python3 tools/navigation_audit.py --strict
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/index.html career/index.html activities/index.html projects/index.html media/index.html contact/index.html
          git commit -m "feat: align subpage accessibility and projects OGP"
          git push origin HEAD:feat/phase2-qa-3vc
