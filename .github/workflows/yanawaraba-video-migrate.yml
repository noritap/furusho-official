name: Yanawaraba Video Migration

on:
  push:
    branches:
      - feat/yanawaraba-ichigoichie

permissions:
  contents: write

concurrency:
  group: yanawaraba-video-migrate
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/yanawaraba-ichigoichie
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add Yanawaraba video
        run: python3 tools/add_yanawaraba_ichigoichie.py
      - name: Refresh visual asset registry and review
        run: |
          python3 tools/collect_visual_assets.py
          python3 tools/render_visual_asset_review.py
      - name: Verify navigation
        run: python3 tools/navigation_audit.py --strict
      - name: Commit migrated files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add career/index.html profile/index.html media/index.html assets/data/media-assets.json .github/visual-asset-review.md
          git commit -m "content: add Yanawaraba Ichigo Ichie video"
          git push origin HEAD:feat/yanawaraba-ichigoichie
