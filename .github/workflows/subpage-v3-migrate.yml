name: Subpage Visual v3 Migration

on:
  push:
    branches:
      - feat/subpage-visual-ui-3vc

permissions:
  contents: write

concurrency:
  group: subpage-visual-v3-migrate
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/subpage-visual-ui-3vc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply profile visual policy migration
        run: python3 tools/profile_visual_policy_migrate.py
      - name: Refresh visual asset registry and review
        run: |
          python3 tools/collect_visual_assets.py
          python3 tools/render_visual_asset_review.py
      - name: Verify navigation
        run: python3 tools/navigation_audit.py --strict
      - name: Commit migrated files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/index.html assets/data/media-assets.json .github/visual-asset-review.md
          git commit -m "chore: align profile visuals with asset policy"
          git push origin HEAD:feat/subpage-visual-ui-3vc
