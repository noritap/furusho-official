name: Navigation v2 Migration

on:
  push:
    branches:
      - feat/navigation-v2-contract

permissions:
  contents: write

concurrency:
  group: navigation-v2-migrate
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/navigation-v2-contract
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize navigation v2
        run: python3 tools/navigation_sync.py
      - name: Verify navigation v2
        run: python3 tools/navigation_audit.py --strict
      - name: Commit synchronized primary pages
        shell: bash
        run: |
          if git diff --quiet -- '*.html'; then
            echo "Primary pages are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html profile/index.html career/index.html activities/index.html projects/index.html media/index.html contact/index.html
          git commit -m "chore: synchronize navigation v2"
          git push origin HEAD:feat/navigation-v2-contract
