name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public content before deployment
        run: node tools/build_public_content.mjs --check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      # GitHub Actions artifact listing can briefly lag behind a successful upload.
      # Avoid the upload-then-immediate-deploy "Found 0 artifact(s)" race.
      - name: Allow Pages artifact to be indexed
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Live Pages smoke test
        shell: bash
        run: |
          set -euo pipefail
          base="https://noritap.github.io/furusho-official"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$base/" -o /tmp/furusho-home.html &&
               curl -fsSL "$base/projects/" -o /tmp/furusho-projects.html &&
               grep -q 'id="current-work"' /tmp/furusho-home.html &&
               grep -q 'RS BROADCAST NETWORK' /tmp/furusho-projects.html &&
               grep -q 'RHYTHM SPEAKER MUSIC' /tmp/furusho-projects.html; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" = "1" || { echo "Published Pages do not yet expose v4 content"; exit 1; }
          curl -fsSL "$base/assets/css/v4-public.css" -o /tmp/furusho-v4.css
          # Confirm that the new brand theme is actually served on every public page.
          brand_ok=0
          for attempt in 1 2 3 4 5 6; do
            brand_ok=1
            for page in profile career activities projects media contact; do
              if ! curl -fsSL "$base/$page/" -o "/tmp/furusho-$page.html" ||
                 ! grep -Fq '<meta name="theme-color" content="#07152F">' "/tmp/furusho-$page.html"; then
                brand_ok=0
                break
              fi
            done
            if test "$brand_ok" = "1" &&
               curl -fsSL "$base/assets/css/style.css" -o /tmp/furusho-style.css &&
               grep -Fq -- '--accent: #087478;' /tmp/furusho-style.css &&
               curl -fsSL "$base/assets/css/home-v3.css" -o /tmp/furusho-home.css &&
               grep -Fq -- '--v3-accent: #087478;' /tmp/furusho-home.css &&
               curl -fsSL "$base/assets/icons/furusho-mark.svg" -o /tmp/furusho-mark.svg &&
               grep -Fq 'data:image/webp;base64,' /tmp/furusho-mark.svg &&
               grep -Fq 'href="https://noritap.github.io/rhythmspeaker/"' /tmp/furusho-profile.html; then
              break
            fi
            brand_ok=0
            sleep 8
          done
          test "$brand_ok" = "1" || { echo "Published Pages do not yet expose the brand-coherent UI"; exit 1; }
          # Verify new editorial photo files are published (not just referenced in HTML).
          for item in profile-shoes-perspective.jpg media-studio-tap-action.jpg contact-pointing-portrait.png; do
            ok_image=0
            for attempt in 1 2 3 4 5; do
              if curl -fsSL "$base/assets/images/editorial/$item" -o "/tmp/$item" && test -s "/tmp/$item"; then
                ok_image=1
                break
              fi
              sleep 6
            done
            test "$ok_image" = "1" || { echo "Photo not delivered: $item"; exit 1; }
          done
          test "$(file --mime-type --brief /tmp/profile-shoes-perspective.jpg)" = "image/jpeg"
          test "$(file --mime-type --brief /tmp/media-studio-tap-action.jpg)" = "image/jpeg"
          test "$(file --mime-type --brief /tmp/contact-pointing-portrait.png)" = "image/png"
          # v4.3: Verify the visible commission route, generated video previews, and Profile share asset.
          grep -Fq 'id="v3-commission-heading"' /tmp/furusho-home.html
          grep -Fq 'href="contact/#request-types"' /tmp/furusho-home.html
          grep -Fq 'assets/images/editorial/profile-shoes-perspective.jpg' /tmp/furusho-profile.html
          curl -fsSL "$base/media/" -o /tmp/furusho-media-v43.html
          test "$(grep -c 'class="media-video-card"' /tmp/furusho-media-v43.html)" -eq 6
          test "$(grep -c 'class="media-video-frame"' /tmp/furusho-media-v43.html)" -eq 6
          curl -fsSL "$base/media/media.css" -o /tmp/furusho-media-v43.css
          grep -Fq '.media-video-frame img' /tmp/furusho-media-v43.css
          # v4.5: published theatrical editorial HOME must expose approved section order and styles.
          grep -Fq 'class="home-v3 home-v45"' /tmp/furusho-home.html
          python3 - <<'PY'
          from pathlib import Path
          t=Path("/tmp/furusho-home.html").read_text()
          ids=['class="section-shell v3-hero"','id="about"','class="v3-statement"','class="v3-section v3-route"','id="selected-works"','id="work"','id="current-work"','id="projects-preview"','id="contact"']
          indices=[t.index(x) for x in ids]
          assert indices==sorted(indices), f"HOME section order drift: {indices}"
          assert "DANCE" not in t or "NORITAKA FURUSHO" in t
          print("HOME editorial section order: OK")
          PY
          curl -fsSL "$base/assets/css/home-v3.css" -o /tmp/furusho-home-v45.css
          grep -Fq 'Artist Editorial Performance / HOME canonical CSS' /tmp/furusho-home-v45.css
          grep -Fq 'career-stage-frankfurt.jpg' /tmp/furusho-home-v45.css
          grep -Fq '.v3-studio-note .v3-button' /tmp/furusho-home-v45.css
          curl -fsSL "$base/assets/css/style.css" -o /tmp/furusho-style-v45.css
          grep -Fq 'rgba(7, 21, 47, .98)' /tmp/furusho-style-v45.css
          # Profile: verified role credits, inherited philosophy, and mobile navigation.
          curl -fsSL "$base/profile/" -o /tmp/furusho-profile-v5.html
          grep -Fq 'id="legacy-title"' /tmp/furusho-profile-v5.html
          grep -Fq '佐々木隆子先生から受け継いだ' /tmp/furusho-profile-v5.html
          grep -Fq 'class="profile-mobile-menu"' /tmp/furusho-profile-v5.html
          test "$(grep -o 'class="work-role"' /tmp/furusho-profile-v5.html | wc -l)" -eq 6
          grep -Fq 'class="activity-detail-link"' /tmp/furusho-profile-v5.html
          curl -fsSL "$base/profile/profile.css" -o /tmp/furusho-profile-v5.css
          grep -Fq '.profile-mobile-menu-links' /tmp/furusho-profile-v5.css
          grep -Fq '.visual-work-card .work-role' /tmp/furusho-profile-v5.css
          # Profile / Career history and awards are visible after publication.
          grep -Fq 'id="profile-career-summary-title"' /tmp/furusho-profile-v5.html
          grep -Fq 'href="../career/#career-timeline"' /tmp/furusho-profile-v5.html
          curl -fsSL "$base/career/" -o /tmp/furusho-career-history.html
          grep -Fq 'id="career-timeline"' /tmp/furusho-career-history.html
          grep -Fq 'id="career-awards"' /tmp/furusho-career-history.html
          grep -Fq 'マイケルジャクソンダンスコンテスト' /tmp/furusho-career-history.html
          grep -Fq '開催年未確認' /tmp/furusho-career-history.html
          grep -Fq 'Tap Dance Card Game' /tmp/furusho-career-history.html
          curl -fsSL "$base/career/career.css" -o /tmp/furusho-career-history.css
          grep -Fq '.career-history-list' /tmp/furusho-career-history.css
          grep -Fq '.career-award-row' /tmp/furusho-career-history.css
          echo "Profile summary, Career timeline and award history: OK"
          echo "Profile story, verified roles, mobile navigation and typography: OK"
          grep -Fq 'class="v3-signature-spotlight"' /tmp/furusho-home.html
          grep -Fq 'watch?v=Wo4teKLf_aE' /tmp/furusho-home.html
          curl -fsSL "$base/media/" -o /tmp/furusho-personal-video.html
          grep -Fq 'id="personal-performances"' /tmp/furusho-personal-video.html
          for video in Wo4teKLf_aE KEWI2a0vH5Y JkfSEzqAFE4 haGdzrx-Kwg _EhX71Wufsc; do
            grep -Fq "watch?v=$video" /tmp/furusho-personal-video.html
          done
          test "$(grep -o 'class="personal-video-card"' /tmp/furusho-personal-video.html | wc -l)" -eq 4
          grep -Fq '代表作と出演・振付実績。' /tmp/furusho-home.html
          grep -Fq '講師の紹介・手配' /tmp/furusho-home.html
          grep -Fq '現在の主な活動。' /tmp/furusho-home.html
          grep -Fq '写真：過去の舞台公演より' /tmp/furusho-home.html
          ! grep -Fq 'YouTubeの再生可否は未検証' /tmp/furusho-home.html
          ! grep -Fq 'OWNER PICK' /tmp/furusho-home.html
          grep -Fq '古庄里好の代表作 / オリジナル作品' /tmp/furusho-personal-video.html
          ! grep -Fq '本人指定の代表作' /tmp/furusho-personal-video.html
          ! grep -Fq '未実施です' /tmp/furusho-personal-video.html
          echo "HOME and Media editorial copy: OK"
          echo "Kibako signature work and 4 documented personal performances: OK"
          echo "v4.5 theatrical HOME and shared navy header: OK"
          echo "v4.3 commissioning route, 6 video previews and Profile OGP: OK"
          echo "Published photo files: 3 of 3 OK"
          echo "Public HOME, Projects, 6 subpages, brand CSS, approved mark and studio route: OK"
