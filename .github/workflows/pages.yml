name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public content before deployment
        run: node tools/build_public_content.mjs --check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Live Pages smoke test
        shell: bash
        run: |
          set -euo pipefail
          base="https://noritap.github.io/furusho-official"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL "$base/" -o /tmp/furusho-home.html &&
               curl -fsSL "$base/projects/" -o /tmp/furusho-projects.html &&
               grep -q 'id="current-work"' /tmp/furusho-home.html &&
               grep -q 'RS BROADCAST NETWORK' /tmp/furusho-projects.html &&
               grep -q 'RHYTHM SPEAKER MUSIC' /tmp/furusho-projects.html; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" = "1" || { echo "Published Pages do not yet expose v4 content"; exit 1; }
          curl -fsSL "$base/assets/css/v4-public.css" -o /tmp/furusho-v4.css
          echo "Public HOME, Projects and v4 stylesheet: OK"
