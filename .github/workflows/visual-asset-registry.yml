name: Visual Asset Registry Sync

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "tools/collect_visual_assets.py"
      - "tools/render_visual_asset_review.py"
      - ".github/workflows/visual-asset-registry.yml"
  pull_request:
    paths:
      - "**/*.html"
      - "assets/data/media-assets.json"
      - ".github/visual-asset-review.md"
      - "tools/collect_visual_assets.py"
      - "tools/render_visual_asset_review.py"
      - ".github/workflows/visual-asset-registry.yml"
  workflow_dispatch:
    inputs:
      fetch_og:
        description: "Also inspect external pages for og:image candidates"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: visual-asset-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate visual asset registry
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.fetch_og }}" == "true" ]]; then
            python3 tools/collect_visual_assets.py --fetch-og
          else
            python3 tools/collect_visual_assets.py
          fi
      - name: Render visual asset review
        run: python3 tools/render_visual_asset_review.py
      - name: Verify generated files in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- assets/data/media-assets.json .github/visual-asset-review.md
      - name: Commit generated files on main when changed
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- assets/data/media-assets.json .github/visual-asset-review.md; then
            echo "Visual asset registry and review are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/media-assets.json .github/visual-asset-review.md
          git commit -m "chore: refresh visual asset registry"
          git push origin HEAD:main
